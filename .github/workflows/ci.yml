name: GlobalNews CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Formatting & Linting Gate
  # ---------------------------------------------------------------------------
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Stable (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Workspace Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Publish Diagnostics on Failure
        if: failure()
        run: |
          cargo fmt --all -- --check > fmt_err.txt 2>&1 || true
          cargo clippy --workspace --all-targets -- -D warnings > clippy_err.txt 2>&1 || true
          git config --global user.name "CI Bot"
          git config --global user.email "ci@globalnews.local"
          git checkout -B ci-lint-debug
          git add -f fmt_err.txt clippy_err.txt
          git commit -m "ci: lint failure logs"
          git push -f origin ci-lint-debug || true

  # ---------------------------------------------------------------------------
  # 2. Multiplatform Native Build & Test Matrix
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Host (arm64)
            os: macos-latest
            slug: macos
          - name: Windows Host (MSVC x64)
            os: windows-latest
            slug: windows
          - name: Linux Host (GNU x64)
            os: ubuntu-latest
            slug: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Workspace Type Check
        run: cargo check --workspace

      - name: Execute Workspace Test Suite
        run: cargo test --workspace -- --nocapture

      - name: Publish Diagnostics on Failure
        if: failure()
        shell: bash
        run: |
          cargo check --workspace > check_err_${{ matrix.platform.slug }}.txt 2>&1 || true
          cargo test --workspace -- --nocapture > test_err_${{ matrix.platform.slug }}.txt 2>&1 || true
          git config --global user.name "CI Bot"
          git config --global user.email "ci@globalnews.local"
          git checkout -B ci-test-${{ matrix.platform.slug }}-debug
          git add -f check_err_${{ matrix.platform.slug }}.txt test_err_${{ matrix.platform.slug }}.txt
          git commit -m "ci: test failure logs for ${{ matrix.platform.name }}"
          git push -f origin ci-test-${{ matrix.platform.slug }}-debug || true

  # ---------------------------------------------------------------------------
  # 3. Frontend & Tauri Shell Verification
  # ---------------------------------------------------------------------------
  frontend-verification:
    name: Frontend Shell Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: crates/globalnews-app
        run: npm install

      - name: Frontend Production Build
        working-directory: crates/globalnews-app
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Dependency Security & Licence Audit
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Licence Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Security Vulnerability Audit
        run: cargo audit
