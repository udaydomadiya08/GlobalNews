name: GlobalNews CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Formatting & Linting Gate
  # ---------------------------------------------------------------------------
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check and Clippy
        shell: bash
        run: |
          echo "Running cargo fmt check..."
          if ! cargo fmt --all -- --check; then
            DIFF_MSG=$(cargo fmt --all -- --check 2>&1 | head -n 30 | tr '\n' ' ')
            echo "::error::$DIFF_MSG"
            exit 1
          fi

          echo "Running cargo clippy..."
          if ! cargo clippy --workspace --all-targets -- -D warnings; then
            CLIPPY_MSG=$(cargo clippy --workspace --all-targets -- -D warnings 2>&1 | head -n 30 | tr '\n' ' ')
            echo "::error::$CLIPPY_MSG"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. Multiplatform Native Build & Test Matrix
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Host (arm64)
            os: macos-latest
          - name: Windows Host (MSVC x64)
            os: windows-latest
          - name: Linux Host (GNU x64)
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Test Workspace
        shell: bash
        run: |
          echo "Running cargo check..."
          if ! cargo check --workspace; then
            CHECK_MSG=$(cargo check --workspace 2>&1 | head -n 30 | tr '\n' ' ')
            echo "::error::$CHECK_MSG"
            exit 1
          fi
          
          echo "Running cargo test..."
          if ! cargo test --workspace -- --nocapture; then
            TEST_MSG=$(cargo test --workspace -- --nocapture 2>&1 | head -n 30 | tr '\n' ' ')
            echo "::error::$TEST_MSG"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 3. Frontend & Tauri Shell Verification
  # ---------------------------------------------------------------------------
  frontend-verification:
    name: Frontend Shell Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: crates/globalnews-app
        run: npm install

      - name: Frontend Production Build
        working-directory: crates/globalnews-app
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Dependency Security & Licence Audit
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Licence Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Security Vulnerability Audit
        run: cargo audit
