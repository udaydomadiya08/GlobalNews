name: GlobalNews CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Formatting & Linting Gate
  # ---------------------------------------------------------------------------
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Stable (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure Cargo.lock Generated
        run: |
          if [ ! -f Cargo.lock ]; then
            cargo generate-lockfile
          fi

      - name: Format and Verify Code Formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Workspace Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy_results.txt

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: clippy_results.txt

      - name: Publish Diagnostic Branch and Code Format
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-results-lint
          git add -f clippy_results.txt Cargo.lock || true
          git commit -m "ci: capture clippy and lockfile [skip ci]" || true
          git push -f origin ci-results-lint || true

  # ---------------------------------------------------------------------------
  # 2. Multiplatform Native Build & Test Matrix
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Host (arm64)
            os: macos-latest
            slug: macos
          - name: Windows Host (MSVC x64)
            os: windows-latest
            slug: windows
          - name: Linux Host (GNU x64)
            os: ubuntu-latest
            slug: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Workspace Type Check
        run: cargo check --workspace

      - name: Execute Workspace Test Suite
        shell: bash
        run: cargo test --workspace -- --nocapture 2>&1 | tee test_results_${{ matrix.platform.slug }}.txt

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform.slug }}
          path: test_results_${{ matrix.platform.slug }}.txt

      - name: Publish Test Results to Branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-results-${{ matrix.platform.slug }}
          git add -f test_results_${{ matrix.platform.slug }}.txt || true
          git commit -m "ci: capture ${{ matrix.platform.slug }} test results [skip ci]" || true
          git push -f origin ci-results-${{ matrix.platform.slug }} || true

  # ---------------------------------------------------------------------------
  # 3. Frontend & Tauri Shell Verification
  # ---------------------------------------------------------------------------
  frontend-verification:
    name: Frontend Shell Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: crates/globalnews-app
        run: npm install

      - name: Frontend Production Build
        working-directory: crates/globalnews-app
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Dependency Security & Licence Audit
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Licence Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Security Vulnerability Audit
        shell: bash
        run: cargo audit --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195 2>&1 | tee audit_results.txt || true

      - name: Run Licence Compliance Audit
        shell: bash
        run: |
          python3 -c "
          import json, subprocess, sys
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--format-version', '1']))
          packages = metadata.get('packages', [])
          allowed = ['MIT', 'Apache-2.0', 'BSD-2-Clause', 'BSD-3-Clause', 'ISC', 'CC0-1.0', 'Unicode-3.0', 'Zlib', 'OpenSSL']
          forbidden = ['GPL', 'AGPL', 'SSPL']
          violations = []
          compliant = 0
          for p in packages:
              lic = p.get('license') or ''
              name = p.get('name')
              ver = p.get('version')
              if any(f in lic for f in forbidden):
                  violations.append(f'{name} {ver}: Forbidden {lic}')
              elif any(a in lic for a in allowed) or lic == '':
                  compliant += 1
              else:
                  violations.append(f'{name} {ver}: Unapproved {lic}')
          print(f'Licence audit passed: {compliant} packages verified compliant.')
          if violations:
              print('Licence violations:', violations)
              sys.exit(1)
          " 2>&1 | tee licence_results.txt

      - name: Publish Audit Results to Branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-results-audit
          touch audit_results.txt licence_results.txt
          git add -f audit_results.txt licence_results.txt
          git commit -m "ci: capture security and licence audit results [skip ci]" || true
          git push -f origin ci-results-audit || true
