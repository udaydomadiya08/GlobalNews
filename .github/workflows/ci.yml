name: GlobalNews CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Formatting & Linting Gate
  # ---------------------------------------------------------------------------
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Format Check and Clippy
        shell: bash
        run: |
          echo "### Rustfmt & Clippy Results" >> "$GITHUB_STEP_SUMMARY"
          
          echo "Running cargo fmt --all -- --check..."
          FMT_STATUS=0
          cargo fmt --all -- --check > /tmp/fmt.log 2>&1 || FMT_STATUS=$?
          
          echo "Running cargo clippy..."
          CLIPPY_STATUS=0
          cargo clippy --workspace --all-targets -- -D warnings > /tmp/clippy.log 2>&1 || CLIPPY_STATUS=$?
          
          echo "#### Format Check Output (exit code: $FMT_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/fmt.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          
          echo "#### Clippy Output (exit code: $CLIPPY_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/clippy.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          
          if [ $FMT_STATUS -ne 0 ] || [ $CLIPPY_STATUS -ne 0 ]; then
            echo "Linting failed!"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 2. Multiplatform Native Build & Test Matrix
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Host (arm64)
            os: macos-latest
          - name: Windows Host (MSVC x64)
            os: windows-latest
          - name: Linux Host (GNU x64)
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and Test Workspace
        shell: bash
        run: |
          echo "### Test Matrix: ${{ matrix.platform.name }}" >> "$GITHUB_STEP_SUMMARY"
          
          echo "Running cargo check..."
          CHECK_STATUS=0
          cargo check --workspace --verbose > /tmp/check.log 2>&1 || CHECK_STATUS=$?
          
          echo "#### Cargo Check (exit code: $CHECK_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 /tmp/check.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          
          if [ $CHECK_STATUS -ne 0 ]; then
            echo "cargo check failed!"
            exit $CHECK_STATUS
          fi
          
          echo "Running cargo test..."
          TEST_STATUS=0
          cargo test --workspace --verbose -- --nocapture > /tmp/test.log 2>&1 || TEST_STATUS=$?
          
          echo "#### Cargo Test (exit code: $TEST_STATUS)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 /tmp/test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          
          if [ $TEST_STATUS -ne 0 ]; then
            echo "cargo test failed!"
            exit $TEST_STATUS
          fi

  # ---------------------------------------------------------------------------
  # 3. Frontend & Tauri Shell Verification
  # ---------------------------------------------------------------------------
  frontend-verification:
    name: Frontend Shell Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: crates/globalnews-app
        run: npm install

      - name: Frontend Production Build
        working-directory: crates/globalnews-app
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Dependency Security & Licence Audit
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Licence Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Security Vulnerability Audit
        run: cargo audit
