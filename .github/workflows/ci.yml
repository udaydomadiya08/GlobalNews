name: GlobalNews CI Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 1. Code Formatting & Linting Gate
  # ---------------------------------------------------------------------------
  lint:
    name: Rustfmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust Stable (pinned)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Workspace Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee clippy_results.txt

      - name: Upload Lint Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: clippy_results.txt

  # ---------------------------------------------------------------------------
  # 2. Multiplatform Native Build & Test Matrix
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Test (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Host (arm64)
            os: macos-latest
            slug: macos
          - name: Windows Host (MSVC x64)
            os: windows-latest
            slug: windows
          - name: Linux Host (GNU x64)
            os: ubuntu-latest
            slug: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Workspace Type Check
        run: cargo check --workspace

      - name: Execute Workspace Test Suite
        shell: bash
        run: cargo test --workspace -- --nocapture 2>&1 | tee test_results_${{ matrix.platform.slug }}.txt

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform.slug }}
          path: test_results_${{ matrix.platform.slug }}.txt

  # ---------------------------------------------------------------------------
  # 3. Frontend & Tauri Shell Verification
  # ---------------------------------------------------------------------------
  frontend-verification:
    name: Frontend Shell Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: crates/globalnews-app
        run: npm install

      - name: Frontend Production Build
        working-directory: crates/globalnews-app
        run: npm run build

  # ---------------------------------------------------------------------------
  # 4. Dependency Security & Licence Audit
  # ---------------------------------------------------------------------------
  security-audit:
    name: Security & Licence Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo.lock
        run: cargo generate-lockfile

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run Security Vulnerability Audit
        run: cargo audit
